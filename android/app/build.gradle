plugins {
    id 'com.android.application'
}

// Clave de firma: usa variables de entorno si existen (para publicar en serio);
// si no, la clave demo incluida en el repo, así cada build se puede instalar
// encima de la anterior sin desinstalar.
def ks = System.getenv('RM_KEYSTORE') ?: file('../keystore/redmain-demo.jks').path
def ksPass = System.getenv('RM_KEYSTORE_PASSWORD') ?: 'redmain-demo'
def ksAlias = System.getenv('RM_KEY_ALIAS') ?: 'redmain'
def ksKeyPass = System.getenv('RM_KEY_PASSWORD') ?: 'redmain-demo'

android {
    namespace 'com.ojorojo.redmain'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ojorojo.redmain'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '0.2.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0') + '-demo'
    }

    signingConfigs {
        release {
            storeFile file(ks)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    // El juego (HTML5) vive en web/ y se empaqueta tal cual como assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
