name: Red Main APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../RedMain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RedMain-apk
          path: RedMain.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Red Main — demo build ${{ github.run_number }}
          prerelease: true
          files: RedMain.apk
          body: |
            APK de prueba de **Red Main** (Ojo Rojo Games), rama `${{ github.ref_name }}`.

            Para instalar: descargá `RedMain.apk` desde el celu, abrilo y permití
            "instalar apps de origen desconocido" si Android lo pide.
